on:
  push:
  pull_request:
  schedule:
  - cron: '0 0 * * *' # test daily against git HEAD of Amaranth

name: CI
jobs:

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
        - '3.9'
        - '3.12'
        # this version range needs to be synchronized with the one in pyproject.toml and pioweave/_compat.py
        amaranth-version:
        - '0.5.0'
        - '0.5.1'
        - '0.5.10'
        - 'git'
        allow-failure:
          - false
    continue-on-error: '${{ matrix.allow-failure }}'
    name: 'test (${{ matrix.python-version }}, Amaranth ${{ matrix.amaranth-version }})'
    steps:
      - name: Check out source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Amaranth release
        if: ${{ matrix.amaranth-version != 'git' }}
        run: |
          pip install 'amaranth==${{ matrix.amaranth-version }}' pytest
      - name: Install Amaranth from git
        if: ${{ matrix.amaranth-version == 'git' }}
        run: |
          pip install pytest git+https://github.com/amaranth-lang/amaranth.git
      - name: Install pioweave
        run: |
          pip install --no-deps -e .
      - name: Run the tests that need no other tool
        # the co-simulation against bitweave's PIO simulator and the firmware builds are skipped here: they need the bitweave binary, pioasm and the Pico SDK
        # (the git version of Amaranth is not one the version gate accepts unless it is the tested commit, hence the override)
        env:
          PIOWEAVE_ALLOW_UNTESTED: ${{ matrix.amaranth-version == 'git' && '1' || '0' }}
        run: |
          python -m pytest -q -W error tests

  document:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install 'amaranth>=0.5,<0.6' sphinx myst-parser sphinx-rtd-theme
          pip install --no-deps -e .
      - name: Build the documentation
        run: |
          sphinx-build -W docs docs/_build
      - name: Run the doctests in the docstrings
        run: |
          sphinx-build -W -b doctest docs docs/_build/doctest
