[build-system]
requires = ["pdm-backend>=2.4,<3"]
build-backend = "pdm.backend"

# Project metadata

[tool.pdm.version]
source = "scm"
# Outside a git checkout (an exported tree, a zip) there is no tag to read: set PDM_BUILD_SCM_VERSION=X.Y.Z for the build (docs/releasing.rst), otherwise this placeholder is used
# (with a warning from pdm-backend). A build from the sdist reads the version from its PKG-INFO.
fallback_version = "0.0.0.dev0+nogit"

[project]
dynamic = ["version"]

name = "pioweave"
description = "Write PIO programs for the Raspberry Pi RP2040, RP2350 and RP2354 in Python or Amaranth, emulate them, and generate projects: builder, platforms and compiler, emulator, board definitions"
readme = "README.md"
requires-python = "~=3.9"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "youprint" }]
keywords = ["amaranth", "pio", "pioasm", "rp2040", "rp2350", "raspberry-pi", "boards", "emulator"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = ["amaranth>=0.5.1,<0.6"]

[project.optional-dependencies]
test = ["coverage"]

[project.scripts]
pioweave = "pioweave.__main__:main"

[project.urls]
"Source Code" = "https://github.com/youprint/pioweave"
"Documentation" = "https://github.com/youprint/pioweave/tree/" # modified in pdm_build.py
"Bug Tracker" = "https://github.com/youprint/pioweave/issues"

[tool.pdm]
distribution = true

[tool.pdm.build]
includes = ["pioweave"]
source-includes = ["tests", "docs", "examples", "scripts", "CHANGELOG.rst", "LICENSE.txt", "CONTRIBUTING.txt", "README.md"]

# Development workflow configuration

[tool.pdm.dev-dependencies]
test = [
  "coverage",
]
docs = [
  "sphinx>=7",
  "sphinx-rtd-theme",
]

[tool.pdm.scripts]
test.cmd = "python -m unittest discover -t . -s tests -v"
test.env = {PYTHONWARNINGS = "error"}
test-quick.cmd = "python -m unittest tests.test_refusals tests.test_program tests.test_boards"
test-quick.env = {PYTHONWARNINGS = "error"}
document.cmd = "sphinx-build docs docs/_build"
test-docs.cmd = "sphinx-build -W -b doctest docs docs/_build/doctest"
matrix.cmd = "sh scripts/matrix.sh"
