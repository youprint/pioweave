[build-system]
requires = ["pdm-backend>=2.4"]
build-backend = "pdm.backend"

[project]
name = "pioweave"
version = "0.1.0"
description = "Write PIO programs for the Raspberry Pi RP2040, RP2350 and RP2354 in Python or Amaranth: builder, Amaranth platforms and compiler, project writers, board definitions"
readme = "README.md"
requires-python = ">=3.9"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{ name = "the project owner" }]
keywords = ["amaranth", "pio", "pioasm", "rp2040", "rp2350", "raspberry-pi", "boards"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Typing :: Typed",
]
dependencies = ["amaranth>=0.5,<0.6"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
pioweave = "pioweave.__main__:main"

[project.urls]
"Source Code" = "https://github.com/youprint/pioweave"
"Documentation" = "https://github.com/youprint/pioweave/tree/main/docs"

[tool.pdm]
distribution = true

[tool.pdm.build]
package-dir = "src"
includes = ["src/pioweave"]
source-includes = ["tests", "LICENSE", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
