[build-system]
requires = ["pdm-backend>=2.4"]
build-backend = "pdm.backend"

# Project metadata

[tool.pdm.version]
source = "scm"

[project]
dynamic = ["version"]

name = "pioweave"
description = "Write PIO programs for the Raspberry Pi RP2040, RP2350 and RP2354 in Python or Amaranth, emulate them, and generate projects: builder, platforms and compiler, emulator, board definitions"
readme = "README.md"
requires-python = "~=3.9"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE.txt"]
authors = [{ name = "the project owner" }]
keywords = ["amaranth", "pio", "pioasm", "rp2040", "rp2350", "raspberry-pi", "boards", "emulator"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Typing :: Typed",
]
dependencies = ["amaranth>=0.5,<0.6"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
pioweave = "pioweave.__main__:main"

[project.urls]
"Source Code" = "https://github.com/youprint/pioweave"
"Documentation" = "https://github.com/youprint/pioweave/tree/main/docs"
"Bug Tracker" = "https://github.com/youprint/pioweave/issues"

[tool.pdm]
distribution = true

[tool.pdm.build]
includes = ["pioweave"]
source-includes = ["tests", "docs", "LICENSE.txt", "CONTRIBUTING.txt", "README.md"]

# Development workflow configuration

[tool.pdm.dev-dependencies]
test = [
  "pytest",
  "coverage",
]
docs = [
  "sphinx>=7",
  "myst-parser",
  "sphinx-rtd-theme",
]

[tool.pdm.scripts]
test.cmd = "python -m pytest -q -W error tests"
test-quick.cmd = "python -m pytest -q -W error tests/test_refusals.py tests/test_program.py tests/test_boards.py tests/test_docs.py"
document.cmd = "sphinx-build docs docs/_build"
matrix.cmd = "sh scripts/matrix.sh"

[tool.pytest.ini_options]
testpaths = ["tests"]
