[build-system]
requires = ["pdm-backend>=2.4"]
build-backend = "pdm.backend"

[project]
name = "pioweave"
version = "0.1.0"
description = "Amaranth platforms for the PIO blocks of the Raspberry Pi RP2040, RP2350 and RP2354: compile an Amaranth FSM to PIO and write the project"
readme = "README.md"
requires-python = ">=3.9"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{ name = "the project owner" }]
keywords = ["amaranth", "pio", "rp2040", "rp2350", "raspberry-pi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Typing :: Typed",
]
dependencies = ["amaranth>=0.5,<0.6", "pioweave-builder==0.1.0"]

[project.urls]
"Source Code" = "https://github.com/youprint/bitweave/tree/main/python"

[tool.pdm]
distribution = true

[tool.pdm.build]
package-dir = "src"
includes = ["src/pioweave"]
source-includes = ["tests", "LICENSE", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
