[build-system]
requires = ["pdm-backend>=2.4"]
build-backend = "pdm.backend"

[project]
name = "pioweave-boards"
version = "0.1.0"
description = "Board definitions (named LED, UART, I2C and SPI pins) for pioweave: Raspberry Pi Pico, Pico 2 and others"
readme = "README.md"
requires-python = ">=3.9"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{ name = "the project owner" }]
keywords = ["amaranth", "boards", "rp2040", "rp2350", "raspberry-pi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Typing :: Typed",
]
dependencies = ["pioweave==0.1.0"]

[project.urls]
"Source Code" = "https://github.com/youprint/bitweave/tree/main/python"

[tool.pdm]
distribution = true

[tool.pdm.build]
package-dir = "src"
includes = ["src/pioweave_boards"]
source-includes = ["tests", "LICENSE", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
